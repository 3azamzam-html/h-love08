<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>Habiba</title>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زرار فيديو</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <h2>فيديو لحبيبة</h2>

        <button id="videoBtn">وريني الفيديو</button>

        <div id="videoBox">
            <video id="myVideo" src="h love.mp4" controls></video>
        </div>
    </div>

    <script src="script.js"></script>

    <div class="container">

        <div class="section">
            <h2>رسالة لحبيبة</h2>
            <button id="msgBtn">عرض الرسالة</button>
            <p id="messageDisplay" class="message pink"></p>
        </div>

        <div class="section">
            <h2>كلام حلو لحبيبة</h2>
            <button id="wordsBtn">عرض الكلام</button>
            <p id="wordsDisplay" class="message red"></p>
        </div>

        <div class="section">
            <h2>مين حبيبة بابا؟</h2>
            <input id="quizInput" type="text" placeholder="اكتب الإجابة">
            <button id="quizBtn">إجابة</button>
            <p id="quizResult" class="message"></p>
        </div>

        <div class="section">
            <h2>صور حبيبة</h2>
            <button id="imgBtn">وريني صورة</button>
            <div id="imgBox">
                <img id="galleryImg" src="" alt="Habiba">
            </div>
        </div>

        <div class="section">
            <h2>عدد الزيارات</h2>
            <p id="visitCount" class="message"></p>
        </div>

    </div>

    <button id="creditBtn">Made by 3b3zeem</button>

    <script src="script.js"></script>
    <!DOCTYPE html>
